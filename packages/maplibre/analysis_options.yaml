include: package:very_good_analysis/analysis_options.yaml

formatter:
  page_width: 80
  trailing_commas: automate

analyzer:
  errors:
    # Flutter 3.50 deprecates package:flutter/material.dart in favour of the
    # material_ui package. The maplibre widgets stay on the SDK copy for now:
    # material_ui is a separate copy of Material, so mixing the two breaks
    # Material/Theme lookups on Flutter 3.47, the minimum supported version.
    # Keep the info from failing `dart analyze --fatal-infos` until the
    # widgets move off Material (upstream #672) or 3.47 support is dropped.
    deprecated_member_use: ignore
  exclude:
    - lib/**.g.dart
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    lines_longer_than_80_chars: false
    flutter_style_todos: false
    cascade_invocations: false
    document_ignores: false
    avoid_catches_without_on_clauses: false
    require_trailing_commas: false
    discarded_futures: false
